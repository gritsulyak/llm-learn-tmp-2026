[project]
name = "ai-smm-multiagent"
version = "0.1.0"
description = "AI SMM-отдел: мультиагентная система (LangGraph + Ollama, локально)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.15",
    "langchain-ollama>=0.2.0",
    "langfuse>=2.53.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "langchain>=1.3.14",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbformat>=5.11.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
