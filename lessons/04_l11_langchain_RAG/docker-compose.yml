version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: enterprise_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Ollama запускается на хосте (не в контейнере), т.к. на ноутбуке без GPU
  # это проще и быстрее. Если нужен контейнер - раскомментируйте:
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: enterprise_rag_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./data/ollama:/root/.ollama
