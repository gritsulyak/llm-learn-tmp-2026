[project]
name = "corporate-knowledge-assistant"
version = "0.1.0"
description = "Корпоративный ассистент: продвинутый парсинг PDF/HTML, RAG с цитированием источников (LlamaIndex + Qdrant + Ollama)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "llama-index>=0.14.10",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-llms-ollama>=0.7.2",
    "llama-index-vector-stores-qdrant>=0.8.1",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.12.0,<1.13",
    "reportlab>=4.2.0",
    "requests>=2.34.2",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corporate_assistant"]
