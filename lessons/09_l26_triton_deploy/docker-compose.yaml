services:
  triton:
    image: ${TRITON_IMAGE:-triton-bls:latest}
    build: .
    ports:
      - 8000:8000
      - 8001:8001
      - 8002:8002
    restart: no
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./model_repository:/models
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    environment:
      - PYTHONUNBUFFERED=1
      - LLAMA_SERVER_URL=http://host.docker.internal:8080