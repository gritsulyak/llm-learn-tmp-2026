[project]
name = "ecql-query-generator"
version = "0.1.0"
description = "DSL Query Generator: дообучение малой LLM (Qwen2.5-1.5B-Instruct, LoRA r=4) переводу русских запросов в ECQL + LLM-as-a-judge"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.3.0",
    "datasets==3.3.0",
    "matplotlib>=3.10.0",
    "peft==0.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "transformers==4.49.0",
    "trl==0.16.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.17.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecql"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks/train_colab.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]